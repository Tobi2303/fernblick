<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<title>Formspree Testlauf – Fernblick</title>
<style>
  body{font-family:sans-serif;background:#111;color:#eee;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
  .box{background:#1a1915;border:1px solid #b8963e;padding:2.5rem;max-width:480px;width:90%;border-radius:4px}
  h2{color:#d4ad5a;margin:0 0 1.5rem;font-size:1.3rem}
  input,select,textarea{width:100%;background:#252420;border:1px solid #444;color:#eee;padding:.7rem 1rem;margin:.4rem 0 1rem;font-size:.95rem;box-sizing:border-box;border-radius:2px}
  button{background:#b8963e;color:#111;border:none;padding:.8rem 2rem;font-size:1rem;cursor:pointer;font-weight:bold;width:100%;border-radius:2px}
  button:hover{background:#d4ad5a}
  button:disabled{opacity:.5;cursor:default}
  #status{margin-top:1rem;padding:1rem;border-radius:2px;display:none;text-align:center}
  .ok{background:rgba(76,175,80,.15);border:1px solid #4caf50;color:#81c784}
  .err{background:rgba(244,67,54,.15);border:1px solid #f44336;color:#ef9a9a}
  label{font-size:.8rem;color:#888;text-transform:uppercase;letter-spacing:.08em}
</style>
</head>
<body>
<div class="box">
  <h2>🧪 Formspree Testlauf</h2>
  <p style="color:#888;font-size:.85rem;margin-bottom:1.5rem">Schickt eine echte Test-Mail an dein Formspree-Konto (tobias@fernblick.online)</p>

  <label>Name</label>
  <input id="name" type="text" value="Testkunde Max Mustermann"/>

  <label>E-Mail des Absenders</label>
  <input id="email" type="email" value="testbestellung@example.com"/>

  <label>Produkt</label>
  <select id="produkt">
    <option>Kalender PDF A4 – 12,90 €</option>
    <option>Kalender PDF A3 – 17,90 €</option>
    <option>Einzelbild JPEG Web – 4,90 €</option>
    <option>Einzelbild JPEG Druckqualität – 14,90 €</option>
  </select>

  <label>Nachricht</label>
  <textarea id="nachricht" rows="3">Dies ist ein Testlauf. Bitte nicht bearbeiten.</textarea>

  <button id="btn" onclick="runTest()">🚀 Test-Mail senden</button>
  <div id="status"></div>
</div>

<script>
async function runTest() {
  const btn = document.getElementById('btn');
  const status = document.getElementById('status');
  btn.disabled = true;
  btn.textContent = 'Sende...';
  status.style.display = 'none';

  const data = {
    name:      document.getElementById('name').value,
    email:     document.getElementById('email').value,
    bestellung:document.getElementById('produkt').value,
    foto:      '– (Testlauf)',
    nachricht: document.getElementById('nachricht').value,
    _subject:  'TEST – Fernblick Bestellung: ' + document.getElementById('produkt').value
  };

  try {
    const res = await fetch('https://formspree.io/f/mzdodadd', {
      method: 'POST',
      headers: {'Content-Type':'application/json','Accept':'application/json'},
      body: JSON.stringify(data)
    });

    const json = await res.json();

    if (res.ok) {
      status.className = 'ok';
      status.innerHTML = '✅ <strong>Erfolg!</strong> Mail wurde gesendet.<br><small>Schau in dein E-Mail-Postfach (auch Spam prüfen!)</small>';
    } else {
      status.className = 'err';
      status.innerHTML = '❌ <strong>Fehler:</strong> ' + (json.error || JSON.stringify(json));
    }
  } catch(e) {
    status.className = 'err';
    status.innerHTML = '❌ <strong>Netzwerkfehler:</strong> ' + e.message;
  }

  status.style.display = 'block';
  btn.disabled = false;
  btn.textContent = '🚀 Test-Mail senden';
}
</script>
</body>
</html>
